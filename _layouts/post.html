---
layout: default
---
<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="meta">
      {{ page.date | date: "%B %d, %Y" }}
      &nbsp;·&nbsp; {{ page.category }}
      {% if page.difficulty %}&nbsp;·&nbsp; difficulty: {{ page.difficulty }}{% endif %}
    </div>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
